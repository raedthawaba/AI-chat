name: hajeen_ai
description: "Hajeen AI Chat Platform - Frontend (Flutter, Bloc architecture)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ─── State Management (single source of truth) ────────────────────────────
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # ─── Dependency Injection ────────────────────────────────────────────────
  get_it: ^7.6.7

  # ─── Networking ───────────────────────────────────────────────────────────
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.0

  # ─── Storage ──────────────────────────────────────────────────────────────
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ─── Routing ──────────────────────────────────────────────────────────────
  go_router: ^14.0.0

  # ─── Connectivity / Permissions ──────────────────────────────────────────
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.0

  # ─── Localization ─────────────────────────────────────────────────────────
  intl: ^0.19.0

  # ─── Functional / Utility ─────────────────────────────────────────────────
  dartz: ^0.10.1
  logger: ^2.0.2+1
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
    - assets/animations/
    - assets/lottie/
    - assets/translations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
